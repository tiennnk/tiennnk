<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140">
  <!-- Border -->
  <rect x="1" y="1" width="398" height="138" rx="7" ry="7"
        fill="none" stroke="#0C969B" stroke-width="1.5" stroke-opacity="0.85"/>

  <!-- Title -->
  <text x="16" y="32" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#0C969B">trustflow</text>

  <!-- Description -->
  <text x="16" y="56" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#b8eced">Identity verification backend — Spring Boot &amp; JPA</text>
  <text x="16" y="72" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#b8eced">Transactional workflows, optimistic locking, tests</text>

  <!-- Tech tags -->
  <rect x="16"  y="88" width="42" height="20" rx="10" fill="#007396" fill-opacity="0.85"/>
  <text x="37"  y="102" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle">Java</text>

  <rect x="64"  y="88" width="86" height="20" rx="10" fill="#6DB33F" fill-opacity="0.85"/>
  <text x="107" y="102" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle">Spring Boot</text>

  <rect x="156" y="88" width="86" height="20" rx="10" fill="#336791" fill-opacity="0.85"/>
  <text x="199" y="102" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle">PostgreSQL</text>

  <rect x="248" y="88" width="74" height="20" rx="10" fill="#FF6600" fill-opacity="0.85"/>
  <text x="285" y="102" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle">RabbitMQ</text>

  <rect x="328" y="88" width="56" height="20" rx="10" fill="#25A162" fill-opacity="0.85"/>
  <text x="356" y="102" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle">JUnit5</text>

  <!-- Repo button -->
  <rect x="294" y="111" width="90" height="21" rx="10" fill="#0C969B"/>
  <text x="339" y="125" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">Repo</text>
