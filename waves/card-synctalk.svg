<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140">
  <!-- Border -->
  <rect x="1" y="1" width="398" height="138" rx="7" ry="7"
        fill="none" stroke="#0C969B" stroke-width="1.5" stroke-opacity="0.85"/>

  <!-- Title -->
  <text x="16" y="32" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#0C969B">synctalk</text>

  <!-- Description -->
  <text x="16" y="56" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#b8eced">Real-time chat backend — WebSocket &amp; JWT</text>
  <text x="16" y="72" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#b8eced">STOMP messaging, MongoDB chat history</text>

  <!-- Tech tags -->
  <rect x="16"  y="88" width="42" height="20" rx="10" fill="#007396" fill-opacity="0.85"/>
  <text x="37"  y="102" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle">Java</text>

  <rect x="64"  y="88" width="86" height="20" rx="10" fill="#6DB33F" fill-opacity="0.85"/>
  <text x="107" y="102" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle">Spring Boot</text>

  <rect x="156" y="88" width="90" height="20" rx="10" fill="#010101" fill-opacity="0.85"/>
  <text x="201" y="102" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle">WebSocket</text>

  <rect x="252" y="88" width="76" height="20" rx="10" fill="#47A248" fill-opacity="0.85"/>
  <text x="290" y="102" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle">MongoDB</text>

  <rect x="334" y="88" width="40" height="20" rx="10" fill="#000000" fill-opacity="0.85"/>
  <text x="354" y="102" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle">JWT</text>

  <!-- Repo button -->
  <rect x="294" y="111" width="90" height="21" rx="10" fill="#0C969B"/>
  <text x="339" y="125" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">Repo</text>
</svg>
